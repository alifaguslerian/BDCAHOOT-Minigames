<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play — BDCAHOOT</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen" class="lobby-screen">
    <div class="tag tag-green" style="margin-bottom:24px;">
      <span class="pulse-dot"></span> Connected
    </div>
    <h1 style="font-size:40px;margin-bottom:8px;">You're in! 🎉</h1>
    <p class="text-muted" style="margin-bottom:8px;" id="quizTitleDisplay">Loading...</p>

    <div class="lobby-code-display">
      <div
        style="font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:8px;">
        Room Code</div>
      <div class="lobby-code" id="lobbyCodeDisplay">------</div>
    </div>

    <div style="margin-bottom:32px;">
      <div style="font-size:24px;font-weight:800;margin-bottom:4px;" id="playerNameDisplay">—</div>
      <p class="text-muted" style="font-size:14px;">
        <span class="pulse-dot"></span> Waiting for host to start...
      </p>
    </div>

    <div
      style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:16px 24px;display:flex;gap:16px;align-items:center;">
      <span style="font-size:28px;">🎮</span>
      <div>
        <div style="font-size:14px;font-weight:700;margin-bottom:2px;">Get Ready</div>
        <div style="font-size:12px;color:var(--text-muted);">Answer fast for more points!</div>
      </div>
    </div>

    <button class="btn btn-ghost btn-sm" style="margin-top:24px;" onclick="window.location.href='/'">Leave Room</button>
  </div>

  <!-- GAME SCREEN — full screen, no sidebar -->
  <div id="gameScreen" style="display:none;" class="fs-layout">

    <div class="fs-topbar">
      <button class="pg-leave-btn" onclick="if(confirm('Leave game?'))window.location.href='/'">✕ Leave</button>
      <div class="pg-progress-pill" id="qProgressDisplay">Q1 / ?</div>
      <div class="pg-players-count">
        <span>👥</span>
        <span id="playerCountDisplay">—</span>
      </div>
    </div>

    <div class="fs-question-area">
      <div class="pg-timer-wrap">
        <svg class="pg-timer-svg" viewBox="0 0 88 88">
          <circle class="pg-timer-track" cx="44" cy="44" r="37" />
          <circle class="pg-timer-prog" id="timerProgress" cx="44" cy="44" r="37" />
        </svg>
        <div class="pg-timer-num" id="timerNumber">—</div>
      </div>

      <div class="fs-question-text" id="questionText">Get ready...</div>

      <div class="fs-answers-grid" id="answersGrid">
        <button class="pg-ans-btn" data-index="0">
          <div class="pg-ans-icon" data-index="0">▲</div>
          <span class="answer-text">—</span>
        </button>
        <button class="pg-ans-btn" data-index="1">
          <div class="pg-ans-icon" data-index="1">◆</div>
          <span class="answer-text">—</span>
        </button>
        <button class="pg-ans-btn" data-index="2">
          <div class="pg-ans-icon" data-index="2">●</div>
          <span class="answer-text">—</span>
        </button>
        <button class="pg-ans-btn" data-index="3">
          <div class="pg-ans-icon" data-index="3">■</div>
          <span class="answer-text">—</span>
        </button>
      </div>
    </div>

  </div>

  <!-- LEADERBOARD SCREEN -->
  <div id="leaderboardScreen" style="display:none;" class="lb-screen">
    <div class="lb-screen-header">
      <div class="lb-screen-title">Leaderboard</div>
      <div class="lb-screen-sub" id="lbScreenSub">After Q1</div>
    </div>

    <div class="lb-screen-list" id="lbScreenList"></div>

    <div class="lb-screen-your">
      <div class="lb-screen-your-label">Your Rank</div>
      <div class="lb-screen-your-card">
        <div class="lb-screen-your-num" id="lbYourRank">—</div>
        <div>
          <div class="lb-screen-your-name" id="lbYourName">You</div>
          <div class="lb-screen-your-score" id="lbYourScore">0 pts</div>
        </div>
      </div>
    </div>
  </div>

  <!-- FEEDBACK OVERLAY -->
  <div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-icon" id="feedbackIcon">✅</div>
    <div class="feedback-label" id="feedbackLabel">Correct!</div>
    <div class="feedback-pts" id="feedbackPts">+1000 pts</div>
  </div>

  <!-- COUNTDOWN OVERLAY -->
  <div class="countdown-overlay" id="countdownOverlay">
    <div class="cd-label">Game starting in</div>
    <div style="position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;">
      <div class="cd-ring-wrap">
        <svg class="cd-svg-ring" viewBox="0 0 260 260">
          <circle class="cd-ring-track" cx="130" cy="130" r="120" />
          <circle class="cd-ring-prog" id="cdRingProg" cx="130" cy="130" r="120" />
        </svg>
        <div class="cd-ripple" id="cdRipple"></div>
      </div>
      <div class="cd-number" id="cdNumber">3</div>
    </div>
    <div class="cd-sub" id="cdSub">Get ready...</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/countdown.js"></script>
  <script src="/js/player.js"></script>
</body>

</html>
