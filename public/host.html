<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host — BDCAHOOT</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <nav class="navbar">
    <div class="navbar-brand" onclick="window.location.href='/'">BDC<span>AH</span>OOT</div>
    <div class="navbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="window.location.href='/'">← Home</button>
      <button class="btn btn-primary btn-sm" onclick="window.location.href='/create-quiz.html'">+ Create Quiz</button>
    </div>
  </nav>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" style="max-width:680px;margin:0 auto;padding:100px 20px 60px;">
    <div style="margin-bottom:36px;">
      <h1 style="font-size:36px;margin-bottom:8px;">Host a Game</h1>
      <p class="text-muted">Select a quiz and start your room</p>
    </div>

    <div class="quiz-meta-card">
      <div class="form-group">
        <label>Select Quiz</label>
        <select class="form-control" id="quizSelect">
          <option value="">Loading quizzes...</option>
        </select>
      </div>
      <div id="quizInfo" style="display:none;margin-top:16px;">
        <div style="display:flex;gap:12px;align-items:center;">
          <span class="tag tag-blue" id="quizQCount"></span>
          <span class="text-muted" style="font-size:14px;" id="quizName"></span>
        </div>
      </div>
      <div style="margin-top:24px;">
        <button class="btn btn-primary" style="width:100%;" id="startHostingBtn">Start Room →</button>
      </div>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen" style="display:none;max-width:680px;margin:0 auto;padding:40px 20px;">
    <div class="host-room-code-display" style="margin-bottom:28px;">
      <div class="room-code-label">Room Code — Share this with players</div>
      <div class="room-code-value" id="displayRoomCode">------</div>
      <p style="margin-top:10px;color:rgba(255,255,255,0.5);font-size:13px;">

      </p>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="pulse-dot"></span>
        <span style="font-size:14px;color:var(--text-secondary);">Waiting for players...</span>
      </div>
      <span class="tag tag-blue" id="lobbyPlayerCount">0 players</span>
    </div>

    <div class="player-list" id="playerListEl" style="margin-bottom:24px;"></div>

    <div style="display:flex;gap:12px;">
      <button class="btn btn-primary btn-lg" style="flex:1;" id="startGameBtn" disabled>
        ▶ Start Game (<span id="playerCountLabel">0</span> players)
      </button>
      <button class="btn btn-ghost" id="endHostBtn">✕ Close Room</button>
    </div>
  </div>

  <!-- LEADERBOARD SCREEN HOST -->
  <div id="hostLbScreen" style="display:none;" class="lb-screen">
    <div class="lb-screen-header">
      <div class="lb-screen-title">Leaderboard</div>
      <div class="lb-screen-sub" id="hostLbSub">After Q1</div>
    </div>
    <div class="lb-screen-list" id="hostLbList"></div>
  </div>

  <!-- GAME SCREEN — full display mode -->
  <div id="gameScreen" style="display:none;" class="hd-layout">

    <div class="hd-main">
      <!-- Topbar -->
      <div class="hd-topbar">
        <div class="hd-pill" id="hdQProgress">Q1 / ?</div>
        <div class="hd-answered-wrap">
          <span class="pulse-dot"></span>
          <span id="hdAnsweredCount">0</span>
          <span style="color:rgba(255,255,255,0.4);font-size:12px;">/ <span id="hdTotalPlayers">0</span> answered</span>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="hd-next-btn" id="nextQuestionBtn" disabled>Next →</button>
          <button class="hd-end-btn" id="endGameBtn" style="margin:0;">End</button>
        </div>
      </div>

      <!-- Question area -->
      <div class="hd-center">
        <div class="hd-timer-wrap">
          <svg class="hd-timer-svg" viewBox="0 0 80 80">
            <circle class="hd-timer-track" cx="40" cy="40" r="34" />
            <circle class="hd-timer-prog" id="hdTimerProg" cx="40" cy="40" r="34" />
          </svg>
          <div class="hd-timer-num" id="hdTimerNum">—</div>
        </div>

        <div class="hd-question" id="hdQuestion">Get ready...</div>

        <div class="hd-answers-grid" id="hdAnswersGrid">
          <div class="hd-ans-card" data-index="0">
            <div class="hd-ans-icon" data-index="0">▲</div>
            <div class="hd-ans-text">—</div>
            <div class="hd-dist-wrap" style="display:none;">
              <div class="hd-dist-bg">
                <div class="hd-dist-fill" style="width:0%"></div>
              </div>
              <div class="hd-dist-count">0</div>
            </div>
          </div>
          <div class="hd-ans-card" data-index="1">
            <div class="hd-ans-icon" data-index="1">◆</div>
            <div class="hd-ans-text">—</div>
            <div class="hd-dist-wrap" style="display:none;">
              <div class="hd-dist-bg">
                <div class="hd-dist-fill" style="width:0%"></div>
              </div>
              <div class="hd-dist-count">0</div>
            </div>
          </div>
          <div class="hd-ans-card" data-index="2">
            <div class="hd-ans-icon" data-index="2">●</div>
            <div class="hd-ans-text">—</div>
            <div class="hd-dist-wrap" style="display:none;">
              <div class="hd-dist-bg">
                <div class="hd-dist-fill" style="width:0%"></div>
              </div>
              <div class="hd-dist-count">0</div>
            </div>
          </div>
          <div class="hd-ans-card" data-index="3">
            <div class="hd-ans-icon" data-index="3">■</div>
            <div class="hd-ans-text">—</div>
            <div class="hd-dist-wrap" style="display:none;">
              <div class="hd-dist-bg">
                <div class="hd-dist-fill" style="width:0%"></div>
              </div>
              <div class="hd-dist-count">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!-- COUNTDOWN OVERLAY -->
  <div class="countdown-overlay" id="countdownOverlay">
    <div class="cd-label">Game starting in</div>
    <div style="position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center;">
      <div class="cd-ring-wrap">
        <svg class="cd-svg-ring" viewBox="0 0 260 260">
          <circle class="cd-ring-track" cx="130" cy="130" r="120" />
          <circle class="cd-ring-prog" id="cdRingProg" cx="130" cy="130" r="120" />
        </svg>
        <div class="cd-ripple" id="cdRipple"></div>
      </div>
      <div class="cd-number" id="cdNumber">3</div>
    </div>
    <div class="cd-sub" id="cdSub">Get ready...</div>
  </div>

  <!-- NEXT QUESTION FLOATING BTN — muncul setelah round end -->
  <div class="hd-next-float" id="nextFloatBtn" style="display:none;">
    <button onclick="document.getElementById('nextQuestionBtn').click()">
      Next Question →
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/countdown.js"></script>
  <script src="/js/host.js"></script>

</body>

</html>
